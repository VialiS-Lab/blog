<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글 대조 — 블라인드 평가</title>
<style>
:root{
  --paper:#FBFBF9; --desk:#EDEDE9; --ink:#1A1A18; --muted:#6B6B66;
  --rule:#D4D4CE; --mark:#3A5A9B; --mark-soft:#E8EDF6;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:var(--desk); color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",
    system-ui,sans-serif;
  font-size:16px; line-height:1.6}

header{border-bottom:1px solid var(--rule); background:var(--desk);
  position:sticky; top:0; z-index:5}
.bar{max-width:860px; margin:0 auto; padding:13px 24px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.count{font-size:19px; font-variant-numeric:tabular-nums}
.count b{font-weight:600}
.count span{color:var(--muted); font-size:14px}
.who{font-size:13px; background:var(--paper); border:1px solid var(--rule);
  padding:6px 10px; font-family:inherit; color:var(--ink); width:130px}
.who:focus-visible{outline:2px solid var(--mark); outline-offset:-2px}
.note{color:var(--muted); font-size:13px; margin-left:auto}
.track{height:2px; background:var(--rule)}
.track i{display:block; height:2px; background:var(--mark); width:0;
  transition:width .18s ease}

main{max-width:860px; margin:0 auto; padding:44px 24px 0}
.doc{margin-bottom:52px; position:relative}
.num{font-size:15px; font-weight:600; color:var(--muted);
  margin:0 0 14px; display:flex; align-items:center; gap:10px}
.num i{display:inline-block; width:26px; height:26px; line-height:26px;
  text-align:center; border:1px solid var(--rule); background:var(--paper);
  font-style:normal; font-size:14px; color:var(--ink)}
.doc.pick .num i{background:var(--mark); border-color:var(--mark); color:#fff}
.sheet{background:var(--paper); border:1px solid var(--rule);
  padding:44px 46px; font-size:19px; line-height:2.05;
  white-space:pre-wrap; word-break:keep-all; letter-spacing:-.005em}
.doc.pick .sheet{border-color:var(--mark); box-shadow:inset 4px 0 0 var(--mark)}

.judge{border-top:1px solid var(--rule); padding:30px 0 70px}
.q{font-size:15px; font-weight:600; margin:0 0 18px}
.rows{display:flex; flex-direction:column; gap:14px}
.row{display:flex; align-items:center; gap:12px}
.row>label{font-size:13px; color:var(--muted); width:52px}
.row.main>label{color:var(--ink); font-weight:600}
.opt{display:flex; border:1px solid var(--rule); background:var(--paper)}
.opt button{font:inherit; font-size:13px; padding:7px 16px; border:0;
  background:transparent; color:var(--muted); cursor:pointer;
  border-right:1px solid var(--rule); white-space:nowrap}
.opt button:last-child{border-right:0}
.opt button[aria-pressed="true"]{background:var(--mark-soft);
  color:var(--mark); font-weight:600}
.opt button:focus-visible{outline:2px solid var(--mark); outline-offset:-2px}
.row.main .opt button{font-size:15px; padding:10px 24px}
.memo{width:100%; margin-top:20px; font:inherit; font-size:14px;
  background:var(--paper); border:1px solid var(--rule); padding:10px 12px;
  resize:vertical; min-height:64px; color:var(--ink); line-height:1.7}
.memo:focus-visible{outline:2px solid var(--mark); outline-offset:-2px}
.foot{display:flex; align-items:center; gap:12px; margin-top:22px;
  flex-wrap:wrap}
button.act{font:inherit; font-size:14px; padding:9px 20px; cursor:pointer;
  background:var(--paper); border:1px solid var(--rule); color:var(--ink)}
button.act:hover{border-color:var(--mark); color:var(--mark)}
button.act:focus-visible{outline:2px solid var(--mark); outline-offset:1px}
button.act.primary{margin-left:auto; background:var(--mark);
  border-color:var(--mark); color:#fff}
#finish{display:none}
#finish.ready{display:inline-block}
.left{margin-left:auto; font-size:13px; color:var(--muted)}
button.act.primary:hover{color:#fff; opacity:.9}
.hint{font-size:12px; color:var(--muted); width:100%; margin-top:4px}

#result{display:none; max-width:820px; margin:0 auto; padding:40px 24px 70px}
body.done #result{display:block}
body.done main{display:none}
#result h1{font-size:27px; font-weight:600; margin:0 0 6px}
#result p.lead{color:var(--muted); font-size:14px; margin:0 0 30px}
#result h2{font-size:13px; font-weight:600; color:var(--muted);
  margin:34px 0 12px; padding-bottom:7px; border-bottom:1px solid var(--rule)}
table{width:100%; border-collapse:collapse; font-size:14px}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--rule)}
th{font-weight:600; font-size:12px; color:var(--muted)}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums; width:56px}
.bar-cell{width:44%}
.meter{height:7px; background:var(--rule); display:flex}
.meter i{display:block; height:7px}
.meter .a{background:var(--mark)}
.meter .b{background:#B9BDB4}
.out{width:100%; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px; line-height:1.75; background:var(--paper);
  border:1px solid var(--rule); padding:14px; min-height:230px;
  resize:vertical; color:var(--ink)}
.sendrow{display:flex; gap:10px; align-items:center; margin-top:14px;
  flex-wrap:wrap}
.ok{color:var(--mark); font-size:13px; display:none}

@media (max-width:720px){
  main{padding:30px 18px 0}
  .sheet{padding:28px 22px; font-size:17px; line-height:1.95}
  .note{display:none}
  .row{align-items:flex-start; flex-direction:column; gap:7px}
  .row>label{width:auto}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="count"><b id="idx">1</b><span> / <span id="total">0</span></span></div>
    <input class="who" id="who" placeholder="이름" autocomplete="off">
    <div class="note">두 글을 읽고 아래에서 나은 쪽을 고른다. 5쌍이면 끝난다.</div>
  </div>
  <div class="track"><i id="fill"></i></div>
</header>

<main id="top">
  <article class="doc" id="doc1">
    <p class="num"><i>1</i> 첫 번째 글</p>
    <div class="sheet" id="T1"></div>
  </article>

  <article class="doc" id="doc2">
    <p class="num"><i>2</i> 두 번째 글</p>
    <div class="sheet" id="T2"></div>
  </article>

  <section class="judge">
    <p class="q">어느 쪽이 이 목적과 독자에게 더 나은가</p>
    <div class="rows" id="rows"></div>
    <textarea class="memo" id="memo"
      placeholder="눈에 띈 대목 — 어색한 문장, 사실 오류, 좋았던 부분"></textarea>
    <div class="foot">
      <button class="act" id="prev">이전</button>
      <button class="act" id="next">다음 쌍</button>
      <span class="left" id="left"></span>
      <button class="act primary" id="finish">결과 보기</button>
      <span class="hint" id="hint">단축키 — 1 첫 번째 · 2 두 번째 · 0 무승부 · Enter 다음</span>
    </div>
  </section>
</main>

<section id="result">
  <h1>평가 결과</h1>
  <p class="lead" id="lead"></p>

  <h2>고른 쪽</h2>
  <table><tbody id="axisTable"></tbody></table>

  <h2>글별 성적</h2>
  <table>
    <thead><tr><th>글</th><th class="n">이김</th><th class="n">무승부</th>
      <th class="n">짐</th><th class="bar-cell"></th></tr></thead>
    <tbody id="itemTable"></tbody>
  </table>

  <h2>보낼 내용</h2>
  <p class="lead">아래를 통째로 복사해 보내면 된다. 파일 첨부는 필요 없다.</p>
  <textarea class="out" id="out" readonly></textarea>
  <div class="sendrow">
    <button class="act primary" id="copy" style="margin-left:0">복사</button>
    <button class="act" id="back">평가로 돌아가기</button>
    <span class="ok" id="ok">복사했다</span>
  </div>
</section>

<script>
const DATA = {"texts": {"25a8db": "밤 10시가 넘어도 기온이 28도 아래로 내려가지 않는 서울의 열대야는 가족 모두를 지치게 했습니다. 이 더위를 피해 주말 여행지로 선택한 곳은 강원도 평창의 대관령이었습니다. 대관령 양떼목장에 도착한 시각은 오후 3시였는데, 한낮임에도 기온은 서울의 한밤중보다 낮은 27도를 가리키고 있었습니다.\n\n낮은 기온 덕분에 쾌적했지만 주차장은 오후 2시 무렵부터 이미 만차에 가까울 정도로 방문객이 많았습니다. 다행히 빈자리를 찾아 차를 세우고 매표소로 향하니 초등학생 자녀를 동반한 가족들이 줄을 길게 늘어서 있었습니다. 약 15분 정도 기다려 성인 9,000원과 어린이 6,000원의 입장료를 내고 목장 안으로 들어섰습니다.\n\n목장 안으로 들어서면 완만한 오르막을 따라 약 1시간 30분이 소요되는 순환 목책로가 시작됩니다. 초등학생 아이 둘과 함께 걷기 시작한 길 중간에는 양들에게 건초를 줄 수 있는 체험장이 마련되어 있습니다. 2,000원을 내고 구입한 건초 컵을 들자 양들이 코를 들이밀었고, 이에 놀란 둘째 아이가 소리를 지르며 뒷걸음질을 치기도 했습니다. 더위에 지친 양들은 주로 나무 그늘이나 먹이통 근처에 모여 조용히 움직이고 있었습니다.\n\n양들과의 만남을 뒤로하고 언덕 위 전망 지점에 오르니 목장 전체와 웅장한 능선이 한눈에 들어왔습니다. 삼각대 대신 난간에 휴대폰을 거치해 가족사진을 남기는 동안, 오후 5시를 넘긴 산바람은 제법 서늘하게 불어왔습니다. 서늘해진 공기에 아이들은 가방에 챙겨온 겉옷을 다시 꺼내 입었습니다. 능선 너머로 해가 내려가면서 초록빛이던 풀밭은 서서히 금색으로 물들어갔습니다.\n\n금빛으로 변한 풍경을 바라보며 목책로 중간 벤치에 앉아 미리 준비한 보온병 커피를 마셨습니다. 주변에서는 서울의 소란스러운 매미 소리 대신 잔잔한 풀벌레 소리가 들려와 마음이 평온해졌습니다. 목장을 나가는 길에 매점에 들러 아이스크림을 샀지만, 에어컨이 가동되는 실내 공기가 너무 차가워 금방 밖으로 나와야 했습니다. 약 3시간 동안의 목장 나들이를 마치고 대관령 인근 숙소로 이동했습니다.\n\n이동한 숙소에서 맞이한 평창의 밤은 서울과는 전혀 다른 세상이었습니다. 창문을 열어두니 에어컨 없이도 시원한 바람이 들어와 첫째 아이는 \"여기는 밤에 안 더워?\"라며 신기해했습니다. 출발 전에는 여름 야외 활동이 덥고 힘들까 봐 걱정했지만, 오후 3시 이후의 일정은 오히려 서울보다 훨씬 쾌적했습니다. 여름철 양떼목장을 방문한다면 해 질 무렵의 추위에 대비해 아이들의 겉옷을 반드시 챙기고, 주차와 더위를 고려해 늦은 오후에 입장하는 것이 좋습니다.", "17821d": "밤 10시에도 기온이 28도 아래로 떨어지지 않는 서울의 열대야를 피해 강원도 평창으로 향했다. 초등학생 두 아이와 함께하는 여름 휴가인 만큼, 너무 덥지 않으면서도 아이들이 즐길 거리가 있는 곳을 찾는 것이 우선이었다.\n\n대관령 양떼목장에 도착한 시간은 오후 3시였다. 한낮의 열기를 피하고 주차난을 덜기 위해 선택한 시간대였지만, 주차장은 여전히 차들로 가득했다. 매표소 앞에는 아이를 동반한 가족 단위 방문객들이 줄을 서 있었고, 도착 당시 기온은 27도로 서울에 비하면 훨씬 쾌적했다.\n\n목책로를 따라 걷는 길은 완만한 오르막이라 아이들도 어렵지 않게 걸었다. 한낮의 열기에 지친 양들은 그늘 밑에 옹기종기 모여 있었고, 먹이통 근처에서만 이따금 움직였다. 아이들을 위해 건초 두 컵을 샀다. 양이 코를 들이밀며 다가오자 둘째 아이가 소리를 지르며 뒷걸음질을 쳤지만, 이내 적응하며 조심스레 건초를 건넸다. 먹이 주기 체험은 마감 1시간 전쯤이 되니 줄이 짧아져 한결 여유로웠다.\n\n오후 5시가 넘어가자 공기의 결이 확연히 달라졌다. 언덕 위 전망 지점에 서니 목장 전체와 능선이 한눈에 들어왔다. 능선 너머로 해가 내려앉으며 초록빛 풀밭이 금색으로 물들기 시작했다. 이때부터는 서늘한 바람이 불어와 아이들에게 미리 챙겨온 겉옷을 입혀야 했다. 매미 소리 대신 풀벌레 소리가 들리는 벤치에 앉아 보온병에 담아온 커피를 마시며 잠시 숨을 돌렸다.\n\n약 3시간의 관람을 마치고 내려오는 길, 매점에서 아이스크림을 하나씩 먹고 숙소로 향했다. 그날 밤 대관령 근처 숙소에서는 에어컨을 켜지 않았다. 창문만 열어두었는데도 서늘한 기운이 방 안을 채웠다. \"여기는 밤에 안 더워?\"라고 묻는 첫째 아이의 말에 평창으로 오길 잘했다는 생각이 들었다.\n\n여름철 아이와 함께 양떼목장을 방문할 계획이라면 오후 3시 이후 입장을 추천한다. 한낮의 뙤약볕을 피할 수 있고 주차도 비교적 수월하다. 다만 해가 지기 시작하면 기온이 급격히 떨어지므로, 아이들을 위한 얇은 겉옷은 반드시 챙겨야 한다. 서울의 열대야를 잠시 잊게 해준, 짧지만 쾌적한 여름날의 기록이었다.", "4edb66": "밤 10시에도 기온이 28도를 웃도는 서울의 열대야를 피해 초등학생 두 아이와 함께 평창으로 향했다. 여름 한낮의 야외 활동이 걱정되기도 했지만, 대관령의 공기는 서울과는 확연히 달랐다.\n\n오후 3시쯤 도착한 평창 양떼목장의 기온은 27도였다. 오후 2시 무렵 이미 주차장이 만차에 가까웠던 탓인지 매표소 앞에는 15분 정도 줄이 이어졌다. 대부분 우리처럼 아이를 동반한 가족 단위 방문객이었다. 입장료는 성인 9,000원, 어린이 6,000원이며 주차는 무료로 이용할 수 있었다.\n\n목장을 한 바퀴 도는 순환 목책로는 오르막이 완만해 아이들도 걷기에 무리가 없었다. 천천히 걸으니 약 1시간 30분 정도 소요되었다. 한낮의 열기가 남아서인지 양들은 대부분 그늘에 모여 있거나 먹이통 근처에서만 머물고 있었다.\n\n아이들을 위해 건초 컵을 두 개 구입해 먹이 주기 체험장으로 향했다. 둘째 아이가 건초를 주려는데 양 한 마리가 코를 쑥 들이밀자, 아이가 깜짝 놀라 소리를 지르며 뒷걸음질을 쳤다. 겁먹은 아이의 반응에 가족 모두 한바탕 웃음을 터뜨렸다.\n\n오후 5시가 넘어가자 언덕 위 전망 지점에서 목장 전체와 능선이 한눈에 들어왔다. 능선 너머로 해가 내려가면서 초록빛이던 풀밭이 순식간에 금색으로 물들었다. 삼각대를 챙기지 못해 난간에 휴대폰을 거치하고 가족사진을 남겼다.\n\n해 질 무렵이 되자 바람이 눈에 띄게 서늘해졌다. 반소매 차림이던 아이들은 챙겨온 겉옷을 다시 꺼내 입었다. 목책로 중간 벤치에 앉아 보온병에 담아온 커피를 마시며 잠시 쉬어갔다. 주변에는 매미 소리 대신 은은한 풀벌레 소리가 들려와 마음이 차분해졌다. 목장을 나가는 길에 매점에서 아이스크림을 샀는데, 실내 공기가 너무 서늘해 금방 밖으로 나와야 했을 정도였다.\n\n목장에서 약 3시간을 보내고 저녁 8시쯤 대관령 인근 숙소에 도착했다. 창문을 열어두니 에어컨 없이도 시원한 바람이 들어와 쾌적하게 잠자리에 들 수 있었다. 첫째 아이가 \"여기는 밤에 안 더워?\"라고 물으며 신기해하는 모습에 이번 여행의 목적을 달성했다는 생각이 들었다.\n\n여름철 양떼목장을 방문할 계획이라면 오후 3시 이후 입장을 추천한다. 주차와 더위 문제를 동시에 해결할 수 있고, 마감 1시간 전쯤이면 먹이 주기 체험을 대기 줄 없이 여유롭게 즐길 수 있다.", "9e867e": "밤 10시에도 기온이 28도 아래로 내려가지 않는 서울의 열대야를 피해 평창으로 향했다. 초등학생 두 아이와 함께하는 여름 여행은 고생길이 훤할 것 같아 걱정스러웠지만, 대관령에 들어서자 공기의 무게부터 달랐다.\n\n오후 3시 무렵 도착한 양떼목장은 200여 면의 주차장이 거의 만차일 정도로 붐볐다. 27도의 기온 속에 15분 정도 줄을 서서 매표를 마쳤는데, 주변을 둘러보니 우리처럼 아이를 동반한 가족들이 대부분이었다. 한낮의 뙤약볕을 피해 오후 3시 이후에 입장하는 것이 주차나 더위 면에서 훨씬 유리하다는 사실을 현장에 와서야 깨달았다.\n\n목책로를 따라 걷는 순환 코스는 경사가 완만하여 아이들의 발걸음도 가벼웠다. 양들은 더운지 그늘 아래 옹기종기 모여 먹이통 근처에서만 입을 오물거리고 있었다. 건초 컵을 2,000원에 두 개 구입해 다가가니 양 한 마리가 코를 쑥 들이밀었고, 깜짝 놀란 둘 const AXES = [["overall","전체","OV",true],["factual","사실","FA"],
  ["selection","선택","SE"],["flow","흐름","FL"],["prose","문장","PR"],
  ["read","가독","RD"],["genre","장르","GE"]];
const STORE = "blind-review-v3";
let cur = 0, votes = {}, who = "";

try{ const s = JSON.parse(localStorage.getItem(STORE) || "{}");
  votes = s.votes || {}; who = s.who || ""; }catch(e){}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({votes, who})); }catch(e){}
}
function pair(){ return DATA.pairs[cur]; }
function rec(){
  const p = pair(), k = p.l + ">" + p.r;
  if(!votes[k]) votes[k] = {left:p.l, right:p.r, memo:""};
  return votes[k];
}
function buildRows(){
  const box = document.getElementById("rows");
  for(const [id,label,,main] of AXES){
    const row = document.createElement("div");
    row.className = "row" + (main ? " main" : "");
    const lab = document.createElement("label"); lab.textContent = label;
    const opt = document.createElement("div"); opt.className = "opt";
    for(const [v,t] of [["L","1번 글"],["=","무승부"],["R","2번 글"]]){
      const b = document.createElement("button");
      b.type="button"; b.textContent=t; b.dataset.axis=id; b.dataset.val=v;
      b.setAttribute("aria-pressed","false");
      b.addEventListener("click", ()=>pick(id,v));
      opt.appendChild(b);
    }
    row.append(lab,opt); box.appendChild(row);
  }
}
function render(){
  const p = pair(), v = rec();
  document.getElementById("T1").textContent = DATA.texts[p.l];
  document.getElementById("T2").textContent = DATA.texts[p.r];
  document.getElementById("idx").textContent = cur+1;
  document.getElementById("fill").style.width =
    ((cur+1)/DATA.pairs.length*100)+"%";
  document.getElementById("memo").value = v.memo || "";
  for(const b of document.querySelectorAll(".opt button"))
    b.setAttribute("aria-pressed", String(v[b.dataset.axis]===b.dataset.val));
  document.getElementById("doc1").classList.toggle("pick", v.overall==="L");
  document.getElementById("doc2").classList.toggle("pick", v.overall==="R");
  updateFinish();
}

function updateFinish(){
  const total = DATA.pairs.length;
  let done = 0;
  for(const p of DATA.pairs){
    const r = votes[p.l + ">" + p.r];
    if(r && r.overall) done++;
  }
  const ready = done === total;
  const btn = document.getElementById("finish");
  btn.classList.toggle("ready", ready);
  document.getElementById("next").style.display =
    (cur === total - 1) ? "none" : "inline-block";
  const left = document.getElementById("left");
  if(ready) left.textContent = "";
  else left.textContent = `아직 ${total - done}쌍 남았다`;
}
function pick(a,v){ const r=rec(); r[a] = (r[a]===v) ? undefined : v;
  save(); render(); }
function go(s){
  const n=cur+s; if(n<0||n>=DATA.pairs.length) return;
  cur=n; render(); window.scrollTo({top:0});
}

function summarize(){
  const done = Object.values(votes).filter(v=>v.overall);
  document.getElementById("lead").textContent =
    `${who || "이름 없음"} · ${done.length}쌍 완료 (전체 ${DATA.pairs.length}쌍)`;

  const at = document.getElementById("axisTable"); at.innerHTML =
    `<tr><th>축</th><th class="n">1번</th><th class="n">무승부</th>
     <th class="n">2번</th><th></th></tr>`;
  for(const [id,label] of AXES){
    let l=0,e=0,r=0;
    for(const v of Object.values(votes)){
      if(v[id]==="L") l++; else if(v[id]==="=") e++; else if(v[id]==="R") r++;
    }
    const tot = l+e+r || 1;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${label}</td><td class="n">${l}</td>
      <td class="n">${e}</td><td class="n">${r}</td>
      <td class="bar-cell"><div class="meter">
        <i class="a" style="width:${l/tot*100}%"></i>
        <i class="b" style="width:${e/tot*100}%"></i></div></td>`;
    at.appendChild(tr);
  }

  const sc = {};
  for(const v of Object.values(votes)){
    if(!v.overall) continue;
    for(const id of [v.left, v.right]) sc[id] = sc[id] || {w:0,d:0,l:0};
    if(v.overall==="L"){ sc[v.left].w++; sc[v.right].l++; }
    else if(v.overall==="R"){ sc[v.right].w++; sc[v.left].l++; }
    else { sc[v.left].d++; sc[v.right].d++; }
  }
  const it = document.getElementById("itemTable"); it.innerHTML = "";
  Object.entries(sc).sort((a,b)=>b[1].w-a[1].w).forEach(([id,s])=>{
    const t = s.w+s.d+s.l || 1;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${id}</td><td class="n">${s.w}</td>
      <td class="n">${s.d}</td><td class="n">${s.l}</td>
      <td class="bar-cell"><div class="meter">
        <i class="a" style="width:${s.w/t*100}%"></i>
        <i class="b" style="width:${s.d/t*100}%"></i></div></td>`;
    it.appendChild(tr);
  });

  const lines = ["#REVIEW v2", "평가자: " + (who || "이름없음"),
    `완료: ${done.length}/${DATA.pairs.length}`];
  for(const [k,v] of Object.entries(votes)){
    if(!v.overall) continue;
    const ax = AXES.map(([id,,code]) => v[id] ? `${code}:${v[id]}` : "")
      .filter(Boolean).join(" ");
    const memo = (v.memo||"").replace(/\s+/g," ").trim();
    lines.push(k + " " + ax + (memo ? " // " + memo : ""));
  }
  document.getElementById("out").value = lines.join("\n");
  document.body.classList.add("done");
  window.scrollTo({top:0});
}

document.getElementById("who").value = who;
document.getElementById("who").addEventListener("input", e=>{
  who = e.target.value.trim(); save(); });
document.getElementById("memo").addEventListener("input", e=>{
  rec().memo = e.target.value; save(); });
document.getElementById("prev").addEventListener("click", ()=>go(-1));
document.getElementById("next").addEventListener("click", ()=>go(1));
document.getElementById("finish").addEventListener("click", summarize);
document.getElementById("back").addEventListener("click", ()=>{
  document.body.classList.remove("done"); render(); window.scrollTo({top:0}); });
document.getElementById("copy").addEventListener("click", async ()=>{
  const ta = document.getElementById("out");
  try{ await navigator.clipboard.writeText(ta.value); }
  catch(e){ ta.select(); document.execCommand("copy"); }
  const ok = document.getElementById("ok");
  ok.style.display="inline"; setTimeout(()=>ok.style.display="none", 2000);
});
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT") return;
  if(document.body.classList.contains("done")) return;
  if(e.key==="1") pick("overall","L");
  else if(e.key==="2") pick("overall","R");
  else if(e.key==="0") pick("overall","=");
  else if(e.key==="Enter"||e.key==="ArrowRight"){
    if(cur === DATA.pairs.length-1 &&
       document.getElementById("finish").classList.contains("ready"))
      summarize();
    else go(1);
  }
  else if(e.key==="ArrowLeft") go(-1);
});
document.getElementById("total").textContent = DATA.pairs.length;
buildRows(); render();
</script>
</body>
</html>
